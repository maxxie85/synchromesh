# Build and test on every push and pull request. A version tag (v1.2.0, v1.3.0-beta.1) also packages the app for
# each platform and publishes a GitHub release with the installers; its notes are the version's CHANGELOG.md section,
# which must exist (a -dev tag uses [Unreleased]).
#
# Everything runs on a Linux runner (ubuntu-latest); macOS packages are cross-built, see build/macos/package.sh.
# To add a platform: add an entry to the package matrix with a script that writes its installer to artifacts/.
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build Synchromesh.slnx -c Release

      - name: Test
        run: dotnet test tests/Synchro.Tests -c Release --no-build --logger "console;verbosity=normal"

      # Before spending time on packages: a release needs its changelog section.
      - name: Check the changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: bash build/ci/changelog-notes.sh "$GITHUB_REF_NAME" > /dev/null

  package:
    name: package ${{ matrix.target }}
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            tools: build/ci/install-macos-packaging-tools.sh
            package: build/macos/package.sh "$VERSION" osx-arm64
            files: artifacts/*.dmg
          - target: windows-x64
            tools: build/ci/install-windows-packaging-tools.sh
            package: build/windows/package.sh "$VERSION" win-x64
            files: artifacts/*-setup.exe
          - target: windows-arm64
            tools: build/ci/install-windows-packaging-tools.sh
            package: build/windows/package.sh "$VERSION" win-arm64
            files: artifacts/*-setup.exe
          # Linux needs no extra tools: dotnet and tar.
          - target: linux-x64
            tools: ""
            package: build/linux/package.sh "$VERSION" linux-x64
            files: artifacts/*-linux-*.tar.gz
          - target: linux-arm64
            tools: ""
            package: build/linux/package.sh "$VERSION" linux-arm64
            files: artifacts/*-linux-*.tar.gz
          # Later: macos-x64 (osx-x64).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install packaging tools
        if: matrix.tools != ''
        run: bash ${{ matrix.tools }}

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Tag $GITHUB_REF_NAME is not a version like v1.2.0 or v1.2.0-beta.1" >&2
            exit 1
          fi
          ${{ matrix.package }}

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: bash build/ci/github-release.sh "$GITHUB_REF_NAME" dist/*/*
